<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Альтер-Его: Повна Колекція</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <h2>🎭 АЛЬТЕР-ЕГО</h2>

    <div class="mode-wrapper">
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="common" onclick="switchMode('common')">🏠 КЛАСИКА</button>
            <button class="mode-btn" data-mode="politics" onclick="switchMode('politics')">🏛️ ПОЛІТИКА</button>
            <button class="mode-btn" data-mode="history" onclick="switchMode('history')">📜 ІСТОРІЯ</button>
            <button class="mode-btn" data-mode="profi" onclick="switchMode('profi')">💼 ПРОФІ</button>
            <button class="mode-btn" data-mode="school" onclick="switchMode('school')">📚 ШКОЛА</button>
            <button class="mode-btn" data-mode="meme" onclick="switchMode('meme')">🐸 МЕМИ</button>
            <button class="mode-btn" data-mode="potter" onclick="switchMode('potter')">⚡ ПОТТЕР</button>
            <button class="mode-btn" data-mode="fantasy" onclick="switchMode('fantasy')">🧙‍♂️ ФЕНТЕЗІ</button>
            <button class="mode-btn" data-mode="gamer" onclick="switchMode('gamer')">🎮 ГЕЙМЕР</button>
            <button class="mode-btn" data-mode="folk" onclick="switchMode('folk')">🌿 ЕТНО-КОД</button>
            <button class="mode-btn" data-mode="kids" onclick="switchMode('kids')">🧸 ЗОО</button>
            <button class="mode-btn" data-mode="women" onclick="switchMode('women')">🌸 ОПОРА</button>
        </div>
    </div>

    <div class="settings-panel">
        <label class="toggle-label"><input type="checkbox" id="check-loc" checked> <span>Тригер/Локація</span></label>
        <label class="toggle-label"><input type="checkbox" id="check-sit" checked> <span>Ситуація</span></label>
        <label class="toggle-label"><input type="checkbox" id="check-trb" checked> <span>Трабл</span></label>
    </div>

    <div class="custom-sit-container">
        <input type="text" id="custom-sit-input" placeholder="Або впиши свою ситуацію тут..." autocomplete="off">
    </div>
<!--
    <div class="instruction-wrapper">
        <button id="toggle-instruction-btn" class="instruction-btn" onclick="toggleInstruction()">
            ❓ Як це працює? (Інструкція)
        </button>
        <div id="instruction-content" class="instruction-content">
            <h4 style="margin-top: 0; color: #ff9f43; margin-bottom: 10px;">🎬 Техніка «Чорно-білий кадр»:</h4>
            <ol style="padding-left: 20px; margin-bottom: 0; line-height: 1.5;">
                <li><strong>Отримай Роль:</strong> Обери або впиши свою тривожну думку.</li>
                <li><strong>Пауза:</strong> Уяви цю думку як яскравий фільм. Подумки натисни «паузу».</li>
                <li><strong>Знебарв:</strong> Вимкни звук, зроби кадр чорно-білим і зменш до розміру марки.</li>
                <li><strong>Новий погляд:</strong> Подивись на цю сіру марку очима свого Альтер-Его.</li>
            </ol>
        </div>
    </div>
-->
    <div class="game-container" id="result-box">
        <div id="cardLoc" class="card"><div class="label">📍 Тригер / Локація</div><div id="txtLoc" class="content">?</div></div>
        <div id="cardSit" class="card"><div class="label">🧨 Ситуація / Думка</div><div id="txtSit" class="content">?</div></div>
        <div id="cardRol" class="card" style="border-color: #fff;"><div class="label">🎭 Твоя Роль</div><div id="txtRol" class="content">Натисніть "Генерувати"</div><div id="hintBox" class="hint-box"></div></div>
        <div id="cardTrb" class="card"><div class="label">🚫 Трабл (Обмеження)</div><div id="txtTrb" class="content">?</div></div>
    </div>

    <div class="action-zone">
        <div id="timerLabel"></div>
        <div id="timerDisplay">00</div>
        <button id="btnGen" class="btn-main" onclick="generate()">🎲 ГЕНЕРУВАТИ</button>
        <button id="btnStart" class="btn-main btn-ready" style="display:none;" onclick="startRound()">🚀 ПОГНАЛИ!</button>
    </div>

    <div style="text-align: center; margin-top: 15px;">
        <button id="download-btn" class="action-btn" style="display: none; background-color: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 1rem;" onclick="downloadResult()">
            💾 Зберегти як картинку
        </button>
    </div>
    <div style="text-align: center; margin-top: 40px; padding-bottom: 20px;">
    <a href="https://forms.gle/kHVZvL5zKy2nZjKq8" 
       target="_blank" 
       class="feedback-btn">
       💡 Запропонувати свою ідею / Відгук
    </a>
</div>

    <script src="script.js"></script>
</body>
</html>
